# Publish the docs site to GitHub Pages.
#
# The site is docs/ rendered by VitePress — see docs/.vitepress/config.mjs.
# Production for the APP is the KKU VM and has nothing to do with this workflow;
# nothing here touches samo.md.kku.ac.th.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# Only one deploy at a time, and let a newer one win — a queued docs build is
# never worth finishing once a later commit exists.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated: true in the config reads git history for each page's
          # date. With the default shallow clone every page would claim the
          # same timestamp.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
