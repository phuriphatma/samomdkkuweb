<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="system-ui, -apple-system, 'Noto Sans Thai', 'Segoe UI', sans-serif">
  <title>main is one long line; each branch splits off for a single job and merges back</title>
  <rect x="0" y="0" width="900" height="250" rx="14" fill="#ffffff" stroke="#d0d4d9"/>

  <text x="24" y="42" font-size="13.5" fill="#5c6773">Short-lived branches, one job each, merged quickly — the longer one lives, the more it collides</text>

  <line x1="70" y1="180" x2="860" y2="180" stroke="#105922" stroke-width="4"/>
  <text x="24" y="185" font-size="14" font-weight="700" fill="#105922">main</text>
  <text x="24" y="236" font-size="12" fill="#5c6773">main is a single continuous line · pushing to it directly is refused · everyone branches off it and merges back</text>

  <path d="M180,180 C218,180 218,108 256,108 L352,108 C390,108 390,180 428,180" fill="none" stroke="#5c6773" stroke-width="2.5"/>
  <circle cx="180" cy="180" r="6.5" fill="#105922"/>
  <circle cx="428" cy="180" r="6.5" fill="#105922"/>
  <rect x="244" y="86" width="120" height="28" rx="7" fill="#f6f7f8" stroke="#d0d4d9"/>
  <text x="304" y="105" text-anchor="middle" font-size="12.5" fill="#1f2933">ui/news-card</text>
  <text x="170" y="204" text-anchor="middle" font-size="11" fill="#5c6773">checkout -b</text>
  <text x="438" y="204" text-anchor="middle" font-size="11" fill="#5c6773">merge PR</text>

  <path d="M520,180 C558,180 558,124 596,124 L692,124 C730,124 730,180 768,180" fill="none" stroke="#5c6773" stroke-width="2.5"/>
  <circle cx="520" cy="180" r="6.5" fill="#105922"/>
  <circle cx="768" cy="180" r="6.5" fill="#105922"/>
  <rect x="584" y="102" width="120" height="28" rx="7" fill="#f6f7f8" stroke="#d0d4d9"/>
  <text x="644" y="121" text-anchor="middle" font-size="12.5" fill="#1f2933">fix/pr-upload</text>

  <text x="876" y="62" text-anchor="end" font-size="12" fill="#FF6F30">Your branch name becomes your preview address</text>
</svg>
