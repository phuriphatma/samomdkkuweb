<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui, -apple-system, 'Noto Sans Thai', 'Segoe UI', sans-serif">
  <title>Sketch: inside a pull request, the checks box lists build, smoke and the Cloudflare Pages preview link</title>
  <rect x="0" y="0" width="900" height="380" rx="14" fill="#ffffff" stroke="#d0d4d9"/>

  <text x="24" y="34" font-size="13" font-weight="600" fill="#5c6773">A SKETCH OF WHAT YOU WILL SEE — scroll to the bottom of the pull request's Conversation tab.</text>

  <rect x="24" y="52" width="852" height="286" rx="10" fill="#ffffff" stroke="#d0d4d9" stroke-width="1.5"/>

  <text x="48" y="84" font-size="14" font-weight="700" fill="#1f2933">ui(news): tighten news card spacing on mobile</text>
  <rect x="48" y="96" width="58" height="22" rx="11" fill="#105922"/>
  <text x="77" y="112" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">Open</text>
  <text x="118" y="112" font-size="11.5" fill="#5c6773">wants to merge 1 commit into main from ui/news-card-spacing</text>

  <rect x="48" y="136" width="804" height="176" rx="9" fill="#f6f7f8" stroke="#d0d4d9"/>
  <text x="68" y="162" font-size="13" font-weight="600" fill="#1f2933">All checks have passed</text>
  <text x="68" y="182" font-size="11.5" fill="#5c6773">3 successful checks</text>

  <line x1="68" y1="196" x2="832" y2="196" stroke="#d0d4d9"/>

  <circle cx="80" cy="216" r="7" fill="#105922"/>
  <text x="100" y="221" font-size="12.5" fill="#1f2933">build</text>
  <text x="300" y="221" font-size="11.5" fill="#5c6773">npm test and npm run build</text>
  <text x="832" y="221" text-anchor="end" font-size="11.5" fill="#5c6773">Details</text>

  <circle cx="80" cy="246" r="7" fill="#105922"/>
  <text x="100" y="251" font-size="12.5" fill="#1f2933">smoke</text>
  <text x="300" y="251" font-size="11.5" fill="#5c6773">loads the preview in a real browser</text>
  <text x="832" y="251" text-anchor="end" font-size="11.5" fill="#5c6773">Details</text>

  <rect x="62" y="264" width="778" height="38" rx="7" fill="#fff7f2" stroke="#FF6F30" stroke-width="2"/>
  <circle cx="80" cy="283" r="7" fill="#105922"/>
  <text x="100" y="288" font-size="12.5" fill="#1f2933">Cloudflare Pages</text>
  <text x="300" y="288" font-size="11.5" fill="#105922">https://ui-news-card-spacing.samomdkkuweb.pages.dev</text>
  <text x="828" y="288" text-anchor="end" font-size="11.5" fill="#5c6773">Details</text>

  <text x="450" y="358" text-anchor="middle" font-size="12" fill="#FF6F30">This is your preview site. Open it, and send the address to anyone you want an opinion from.</text>
</svg>
