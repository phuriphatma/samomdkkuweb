<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui, -apple-system, 'Noto Sans Thai', 'Segoe UI', sans-serif">
  <title>Two options when B depends on A: merge A early but unreachable, or stack B on A and rebase it later</title>
  <rect x="0" y="0" width="900" height="470" rx="14" fill="#ffffff" stroke="#d0d4d9"/>

  <!-- OPTION 1 FIRST. The page recommends it first, so the picture shows it
       first; a diagram that contradicts the reading order teaches the wrong
       default before a word is read. -->
  <text x="24" y="36" font-size="15" font-weight="700" fill="#1f2933">Option 1 — merge A into main now, but leave it unreachable</text>
  <text x="24" y="57" font-size="12" fill="#5c6773">Try this first. Safe because merging is not publishing — nothing reaches students until a maintainer deploys.</text>

  <line x1="70" y1="150" x2="820" y2="150" stroke="#105922" stroke-width="4"/>
  <text x="24" y="155" font-size="13.5" font-weight="700" fill="#105922">main</text>

  <path d="M150,150 C186,150 186,110 222,110 L308,110 C344,110 344,150 380,150" fill="none" stroke="#5c6773" stroke-width="2.5"/>
  <circle cx="150" cy="150" r="6.5" fill="#105922"/>
  <circle cx="380" cy="150" r="6.5" fill="#105922"/>
  <rect x="217" y="96" width="96" height="27" rx="7" fill="#f6f7f8" stroke="#d0d4d9"/>
  <text x="265" y="114" text-anchor="middle" font-size="12.5" fill="#1f2933">feat/a</text>
  <text x="380" y="176" text-anchor="middle" font-size="11.5" fill="#5c6773">A merged — hidden, nobody sees it</text>

  <path d="M480,150 C516,150 516,110 552,110 L638,110 C674,110 674,150 710,150" fill="none" stroke="#5c6773" stroke-width="2.5"/>
  <circle cx="480" cy="150" r="6.5" fill="#105922"/>
  <circle cx="710" cy="150" r="6.5" fill="#105922"/>
  <rect x="547" y="96" width="96" height="27" rx="7" fill="#f6f7f8" stroke="#d0d4d9"/>
  <text x="595" y="114" text-anchor="middle" font-size="12.5" fill="#1f2933">feat/b</text>
  <text x="710" y="176" text-anchor="middle" font-size="11.5" fill="#5c6773">B merged</text>

  <text x="24" y="205" font-size="12" fill="#5c6773">B branches off main as usual, because A is already there. Nothing is stacked and nothing has to be rewritten.</text>

  <line x1="24" y1="228" x2="876" y2="228" stroke="#d0d4d9" stroke-width="1"/>

  <text x="24" y="262" font-size="15" font-weight="700" fill="#1f2933">Option 2 — stack B on A, then rebase B once A is merged</text>
  <text x="24" y="283" font-size="12" fill="#5c6773">Only when A genuinely should not be merged yet — it is unfinished, or not reviewed.</text>

  <line x1="70" y1="404" x2="820" y2="404" stroke="#105922" stroke-width="4"/>
  <text x="24" y="409" font-size="13.5" font-weight="700" fill="#105922">main</text>

  <path d="M150,404 C186,404 186,360 222,360 L430,360" fill="none" stroke="#5c6773" stroke-width="2.5"/>
  <circle cx="150" cy="404" r="6.5" fill="#105922"/>
  <rect x="230" y="346" width="96" height="27" rx="7" fill="#f6f7f8" stroke="#d0d4d9"/>
  <text x="278" y="364" text-anchor="middle" font-size="12.5" fill="#1f2933">feat/a</text>

  <!-- THE BOX THAT WAS REPORTED AS "not aligned". It was not an alignment
       error: x was correct and the box was 56px too NARROW, so a 268px
       sentence hung out of both ends of a 212px chip. Widened to fit, and
       tools/svg-text-fit.mjs now measures every label in docs/diagrams. -->
  <path d="M340,360 C376,360 376,318 412,318 L640,318" fill="none" stroke="#FF6F30" stroke-width="2.5" stroke-dasharray="7 4"/>
  <circle cx="340" cy="360" r="6" fill="#FF6F30"/>
  <rect x="404" y="304" width="316" height="28" rx="7" fill="#fff7f2" stroke="#FF6F30"/>
  <text x="562" y="323" text-anchor="middle" font-size="12.5" fill="#1f2933">feat/b — branched off feat/a, not off main</text>

  <path d="M430,360 C466,360 466,404 502,404" fill="none" stroke="#105922" stroke-width="2.5"/>
  <circle cx="502" cy="404" r="6.5" fill="#105922"/>
  <text x="502" y="430" text-anchor="middle" font-size="11.5" fill="#5c6773">A merged</text>

  <path d="M640,318 C676,318 676,404 712,404" fill="none" stroke="#105922" stroke-width="2.5"/>
  <circle cx="712" cy="404" r="6.5" fill="#105922"/>
  <text x="712" y="430" text-anchor="middle" font-size="11.5" fill="#5c6773">B merged</text>

  <text x="876" y="292" text-anchor="end" font-size="11.5" fill="#FF6F30">B must be rebased onto main after A merges</text>
  <text x="24" y="456" font-size="12" fill="#5c6773">Extra work, and the rebase rewrites B's history — which is why option 1 is the recommended one.</text>
</svg>
