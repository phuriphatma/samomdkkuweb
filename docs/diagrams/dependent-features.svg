<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="system-ui, -apple-system, 'Noto Sans Thai', 'Segoe UI', sans-serif">
  <title>สองทางเลือกเมื่องาน B ต้องรองาน A: แตก branch ซ้อนแล้ว rebase หรือรวม A เข้า main แบบยังเข้าไม่ถึง</title>
  <rect x="0" y="0" width="900" height="440" rx="14" fill="#ffffff" stroke="#d0d4d9"/>

  <text x="24" y="36" font-size="15" font-weight="700" fill="#1f2933">ทาง 1 — แตก branch ซ้อน (stacked) แล้ว rebase เมื่อ A ถูกรวม</text>
  <text x="24" y="58" font-size="12" fill="#5c6773">ใช้เมื่อ A ยังไม่ควรถูกรวม เพราะยังไม่ผ่านรีวิว</text>

  <line x1="70" y1="168" x2="860" y2="168" stroke="#105922" stroke-width="4"/>
  <text x="24" y="173" font-size="13.5" font-weight="700" fill="#105922">main</text>

  <path d="M170,168 C206,168 206,120 242,120 L472,120" fill="none" stroke="#5c6773" stroke-width="2.5"/>
  <circle cx="170" cy="168" r="6.5" fill="#105922"/>
  <rect x="250" y="98" width="92" height="27" rx="7" fill="#f6f7f8" stroke="#d0d4d9"/>
  <text x="296" y="116" text-anchor="middle" font-size="12.5" fill="#1f2933">feat/a</text>

  <path d="M392,120 C428,120 428,74 464,74 L716,74" fill="none" stroke="#FF6F30" stroke-width="2.5" stroke-dasharray="7 4"/>
  <circle cx="392" cy="120" r="6" fill="#FF6F30"/>
  <rect x="472" y="52" width="212" height="27" rx="7" fill="#fff7f2" stroke="#FF6F30"/>
  <text x="578" y="70" text-anchor="middle" font-size="12.5" fill="#1f2933">feat/b — แตกจาก feat/a ไม่ใช่จาก main</text>

  <path d="M472,120 C508,120 508,168 544,168" fill="none" stroke="#105922" stroke-width="2.5"/>
  <circle cx="544" cy="168" r="6.5" fill="#105922"/>
  <text x="544" y="192" text-anchor="middle" font-size="11.5" fill="#5c6773">A ถูกรวม</text>

  <path d="M716,74 C752,74 752,168 788,168" fill="none" stroke="#105922" stroke-width="2.5"/>
  <circle cx="788" cy="168" r="6.5" fill="#105922"/>
  <text x="788" y="192" text-anchor="middle" font-size="11.5" fill="#5c6773">B ถูกรวม</text>

  <text x="566" y="140" font-size="11.5" fill="#FF6F30">หลังจากนี้ B ต้อง rebase มาที่ main</text>

  <line x1="24" y1="222" x2="876" y2="222" stroke="#d0d4d9" stroke-width="1"/>

  <text x="24" y="254" font-size="15" font-weight="700" fill="#1f2933">ทาง 2 — รวม A เข้า main ไปเลย แต่ยังเข้าไม่ถึง (ไม่มีลิงก์ในเมนู)</text>
  <text x="24" y="276" font-size="12" fill="#5c6773">ง่ายกว่ามาก และควรเป็นตัวเลือกแรกเสมอ — ปลอดภัยเพราะ "รวม ≠ ขึ้นเว็บจริง"</text>

  <line x1="70" y1="352" x2="860" y2="352" stroke="#105922" stroke-width="4"/>
  <text x="24" y="357" font-size="13.5" font-weight="700" fill="#105922">main</text>

  <path d="M170,352 C206,352 206,312 242,312 L338,312 C374,312 374,352 410,352" fill="none" stroke="#5c6773" stroke-width="2.5"/>
  <circle cx="170" cy="352" r="6.5" fill="#105922"/>
  <circle cx="410" cy="352" r="6.5" fill="#105922"/>
  <rect x="244" y="290" width="92" height="27" rx="7" fill="#f6f7f8" stroke="#d0d4d9"/>
  <text x="290" y="308" text-anchor="middle" font-size="12.5" fill="#1f2933">feat/a</text>
  <text x="410" y="384" text-anchor="middle" font-size="11.5" fill="#5c6773">A ถูกรวม — ยังไม่มีใครเห็น</text>

  <path d="M500,352 C536,352 536,312 572,312 L668,312 C704,312 704,352 740,352" fill="none" stroke="#5c6773" stroke-width="2.5"/>
  <circle cx="500" cy="352" r="6.5" fill="#105922"/>
  <circle cx="740" cy="352" r="6.5" fill="#105922"/>
  <rect x="574" y="290" width="92" height="27" rx="7" fill="#f6f7f8" stroke="#d0d4d9"/>
  <text x="620" y="308" text-anchor="middle" font-size="12.5" fill="#1f2933">feat/b</text>

  <text x="24" y="422" font-size="12" fill="#5c6773">B แตกจาก main ตามปกติ เพราะ A อยู่ใน main แล้ว — ไม่มีอะไรซ้อน ไม่มีอะไรต้อง rebase</text>
</svg>
