  <!-- VS category manager — SE publishers manage the หมวดหมู่ list used by
       the publish-to-board panel + the public board filter chips.
       CRUD via vs_categories (RLS vs_categories_write_staff, 0072).
       "ลบ" is a soft deactivate: tickets keep referencing the id, the board
       and publish select simply stop offering it. -->
  <div class="modal fade" id="vsCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header bg-light">
          <h5 class="modal-title fw-bold"><i class="bi bi-tags me-2"></i>จัดการหมวดหมู่กระดานปัญหา</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">
            หมวดหมู่ใช้ในแผงเผยแพร่และตัวกรองบนกระดานปัญหา
            หมวดที่ติด <i class="bi bi-shield-lock"></i> เป็นความลับ — เผยแพร่สู่สาธารณะไม่ได้
            การซ่อนหมวดไม่กระทบเรื่องที่บันทึกไว้แล้ว
          </p>
          <div id="vsCatList" class="vs-cat-list mb-3">
            <div class="text-muted small">กำลังโหลด…</div>
          </div>
          <hr>
          <h6 class="small fw-bold text-muted mb-2"><i class="bi bi-plus-circle me-1"></i>เพิ่มหมวดหมู่ใหม่</h6>
          <div class="d-flex flex-wrap gap-2 align-items-center">
            <input type="text" id="vsCatNewLabel" class="form-control form-control-sm flex-grow-1"
              style="min-width: 200px;" maxlength="60" placeholder="ชื่อหมวดหมู่ เช่น ความปลอดภัย" autocomplete="off">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="vsCatNewConfidential">
              <label class="form-check-label small" for="vsCatNewConfidential">
                <i class="bi bi-shield-lock"></i> ความลับ
              </label>
            </div>
            <button type="button" class="btn btn-sm btn-submit" onclick="vsCatAdd()">เพิ่ม</button>
          </div>
          <div id="vsCatStatus" class="form-text small mt-2 d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">ปิด</button>
        </div>
      </div>
    </div>
  </div>
