  <!-- Sign-in modal — two screens: Login (with Google + username/password) and Register -->
  <div class="modal fade" id="signinModal" tabindex="-1" aria-labelledby="signinModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="signinModalLabel">
            <span class="brand-mdkku">MDKKU</span><span class="brand-samo">SAMO</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4 pt-2">

          <!-- ====== LOGIN SCREEN ======
               ORDER IS THE MESSAGE, and so is what the words CLAIM.

               Google leads because ระบบบ้าน matches `users.email` against
               `students.kkumail`: an account that is not a kkumail address can
               never see its สายรหัส, บ้าน or อาจารย์ที่ปรึกษา, and a
               username/password account has no email at all (auth.js stores ''
               for the synthetic one). Leading with the password form steered
               people into the one state where the main feature of the site
               silently does not exist for them.

               But the earlier copy over-corrected. "นักศึกษาและบุคลากร MDKKU ใช้
               บัญชี Google ของมหาวิทยาลัย" + "เลือกบัญชีที่ลงท้ายด้วย @kkumail.com"
               reads as a REQUIREMENT, so anyone outside KKU — the guests this
               site actively wants — concluded Google was not for them and went
               looking for another door. Google sign-in accepts ANY Google
               account. So each line now says WHO IT IS FOR, not what it unlocks:
               the audience is the useful fact, and listing benefits
               (สายรหัส/บ้าน/ทีม) only made the KKU domains look mandatory again.

               The password form is what it has always actually been: the way in
               WITHOUT revealing who you are. It is not "for ฝ่ายงาน" — the
               tradeoff is simply that an account with no email can never match
               `students.kkumail`, so ระบบบ้าน stays empty for it. That is a
               choice a person can make, so it is stated plainly and left open,
               not collapsed behind a link: hiding a legitimate route makes it
               look like a footnote and costs a click for no gain. Hierarchy is
               carried by button WEIGHT (filled vs outline) instead. -->
          <div id="signinLoginScreen">
            <h6 class="fw-bold mb-3 text-center">เข้าสู่ระบบ</h6>

            <button type="button" class="btn btn-custom w-100 py-2" onclick="samoGoogleSignIn()">
              <i class="bi bi-google me-2"></i> เข้าสู่ระบบด้วย Google
            </button>
            <p class="signin-kku-hint text-center">
              <!-- Thai has no spaces inside a word and Chrome will break mid-term,
                   so each domain is kept whole with nowrap. -->
              สำหรับบุคคลทั่วไป และนักศึกษา/บุคลากร มข.
              (<strong class="text-nowrap">@kkumail.com</strong> หรือ
              <strong class="text-nowrap">@kku.ac.th</strong>)
            </p>

            <div class="signin-divider my-3">
              <span>หรือ</span>
            </div>

            <!-- `required` here is safe: this form is always visible whenever the
                 login screen is, so it can never be a required field inside a
                 display:none container blocking submit (mistakes.md). The
                 register screen is a SEPARATE form, so hiding this screen while
                 registering cannot block that submit either. -->
            <form id="signinLoginForm" onsubmit="event.preventDefault(); samoPasswordSignIn();">
              <p class="signin-alt-caption text-center">สำหรับผู้ที่ไม่ต้องการเปิดเผยตัวตน</p>
              <div class="mb-2">
                <label class="form-label small fw-bold mb-1" for="signinLoginUsername">ชื่อผู้ใช้</label>
                <input type="text" class="form-control" id="signinLoginUsername" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label small fw-bold mb-1" for="signinLoginPassword">รหัสผ่าน</label>
                <input type="password" class="form-control" id="signinLoginPassword"
                  autocomplete="current-password" required>
              </div>
              <div id="signinLoginAlert" class="alert alert-danger small py-2 d-none mb-3"></div>
              <button type="submit" class="btn btn-outline-secondary w-100" id="signinLoginBtn">
                <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ
              </button>
            </form>

            <p class="text-muted small mt-3 mb-0 text-center">
              ยังไม่มีบัญชีชื่อผู้ใช้?
              <a href="#" class="fw-bold text-decoration-none" style="color: var(--brand-primary);"
                onclick="event.preventDefault(); samoShowSigninScreen('register');">
                สมัครสมาชิก
              </a>
            </p>
          </div>

          <!-- ====== REGISTER SCREEN ====== -->
          <div id="signinRegisterScreen" class="d-none">
            <h6 class="fw-bold mb-3 text-center">สมัครสมาชิก</h6>

            <form id="signinRegisterForm" onsubmit="event.preventDefault(); samoPasswordRegister();">
              <div class="mb-3">
                <label class="form-label small fw-bold">Username</label>
                <input type="text" class="form-control" id="signinRegisterUsername" autocomplete="username"
                  placeholder="อย่างน้อย 3 ตัวอักษร" required minlength="3">
              </div>
              <div class="mb-3">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" class="form-control" id="signinRegisterPassword" autocomplete="new-password"
                  placeholder="อย่างน้อย 4 ตัวอักษร" required minlength="4">
              </div>
              <div class="mb-3">
                <label class="form-label small fw-bold">Confirm Password</label>
                <input type="password" class="form-control" id="signinRegisterConfirm" autocomplete="new-password"
                  placeholder="กรอกรหัสผ่านอีกครั้ง" required>
              </div>
              <div id="signinRegisterAlert" class="alert alert-danger small py-2 d-none mb-3"></div>
              <button type="submit" class="btn btn-custom w-100" id="signinRegisterBtn">
                <i class="bi bi-person-plus me-1"></i> สมัครสมาชิก
              </button>
            </form>

            <p class="text-muted small mt-4 mb-0 text-center">
              มีบัญชีอยู่แล้ว?
              <a href="#" class="fw-bold text-decoration-none" style="color: var(--brand-primary);"
                onclick="event.preventDefault(); samoShowSigninScreen('login');">
                เข้าสู่ระบบ
              </a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>
