  <!-- Sign-in modal — ONE screen, two routes. Google stays visible at all times;
       only the anonymous panel swaps between เข้าสู่ระบบ and สมัครใหม่. -->
  <div class="modal fade signin-modal" id="signinModal" tabindex="-1" aria-labelledby="signinModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <span class="modal-title fw-bold" id="signinModalLabel">
            <span class="brand-mdkku">MDKKU</span><span class="brand-samo">SAMO</span>
          </span>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button>
        </div>
        <div class="modal-body signin-body">

          <h2 class="signin-title" id="signinModalTitle">เข้าสู่ระบบ</h2>

          <!-- ====== ROUTE 1 — GOOGLE ======
               ORDER IS THE MESSAGE, and so is what the words CLAIM.

               Google leads because ระบบบ้าน matches `users.email` against
               `students.kkumail`: an account that is not a kkumail address can
               never see its สายรหัส, บ้าน or อาจารย์ที่ปรึกษา, and a
               username/password account has no email at all (auth.js stores ''
               for the synthetic one). Leading with the password form steered
               people into the one state where the main feature of the site
               silently does not exist for them.

               THE CAPTION HAS NOW BEEN REPORTED TWICE, so read this before
               editing it. Version 1 ("เลือกบัญชีที่ลงท้ายด้วย @kkumail.com") was
               an imperative and read as a requirement. Version 2 named
               บุคคลทั่วไป but put the two KKU domains in bold brand green —
               the only emphasis on the line — and the owner read the button as
               KKU-only AGAIN: "it also gmail.com email etc."

               EMPHASIS IS A CLAIM. Bolding the domains said "these are the
               addresses that count" louder than the sentence said otherwise. So
               the domains are no longer the emphasised words; GMAIL IS NAMED
               FIRST, as the concrete thing a non-KKU reader is looking for, and
               the KKU addresses follow as an also — still scannable, no longer
               the headline. Nothing here lists what a KKU address unlocks: a
               benefit list is what made the domains look mandatory the first
               time. -->
          <button type="button" class="btn btn-custom signin-google" onclick="samoGoogleSignIn()">
            <i class="bi bi-google" aria-hidden="true"></i>
            <span>เข้าสู่ระบบด้วย Google</span>
          </button>
          <p class="signin-kku-hint">
            <!-- Thai has no spaces inside a word and Chrome will break mid-term,
                 so each domain is kept whole with nowrap. -->
            ใช้ได้ทุกบัญชี Google ทั้ง Gmail ของบุคคลทั่วไป และอีเมล มข.
            (<span class="text-nowrap">@kkumail.com</span>,
            <span class="text-nowrap">@kku.ac.th</span>)
          </p>

          <div class="signin-divider"><span>หรือ</span></div>

          <!-- ====== ROUTE 2 — ANONYMOUS ======
               The username/password route is what it has always actually been:
               the way in WITHOUT revealing who you are. It is not "for ฝ่ายงาน"
               — that was an invented purpose, corrected by the owner.

               IT IS ONE ROUTE, NOT TWO. Previously signing in and signing up
               were separate full screens, and the only way to reach signup was a
               ~14px text link at the bottom that said "ยังไม่มีบัญชีชื่อผู้ใช้?"
               — which never mentioned anonymity, so the ONE thing the route is
               for was invisible at the exact moment somebody chose it. Now both
               live under one heading that names the route, and the segmented
               control switches only the fields. Google never disappears. -->
          <section class="signin-anon" aria-labelledby="signinAnonTitle">
            <h3 class="signin-anon-title" id="signinAnonTitle">เข้าใช้แบบไม่เปิดเผยตัวตน</h3>
            <p class="signin-anon-sub">ตั้งชื่อผู้ใช้และรหัสผ่านเอง ไม่ต้องใช้อีเมล</p>

            <div class="signin-seg" role="tablist" aria-label="เลือกวิธีเข้าใช้แบบไม่เปิดเผยตัวตน">
              <button type="button" class="signin-seg-btn is-active" role="tab" id="signinSegLogin"
                aria-selected="true" aria-controls="signinLoginScreen"
                onclick="samoShowSigninScreen('login')">มีบัญชีอยู่แล้ว</button>
              <button type="button" class="signin-seg-btn" role="tab" id="signinSegRegister"
                aria-selected="false" aria-controls="signinRegisterScreen"
                onclick="samoShowSigninScreen('register')">สร้างบัญชีใหม่</button>
            </div>

            <!-- `required` is safe on BOTH forms: they are separate <form>s, so a
                 required field inside the hidden one can never block the other's
                 submit (docs/mistakes/frontend-ui.md). -->
            <div id="signinLoginScreen" role="tabpanel" aria-labelledby="signinSegLogin">
              <form id="signinLoginForm" onsubmit="event.preventDefault(); samoPasswordSignIn();">
                <div class="signin-field">
                  <label class="signin-label" for="signinLoginUsername">ชื่อผู้ใช้</label>
                  <input type="text" class="form-control signin-input" id="signinLoginUsername"
                    autocomplete="username" required>
                </div>
                <div class="signin-field">
                  <label class="signin-label" for="signinLoginPassword">รหัสผ่าน</label>
                  <div class="signin-input-wrap">
                    <input type="password" class="form-control signin-input" id="signinLoginPassword"
                      autocomplete="current-password" required>
                    <button type="button" class="signin-reveal" data-signin-reveal="signinLoginPassword"
                      aria-label="แสดงรหัสผ่าน" aria-pressed="false">
                      <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                  </div>
                </div>
                <div id="signinLoginAlert" class="alert alert-danger signin-alert d-none" role="alert"></div>
                <button type="submit" class="btn signin-submit" id="signinLoginBtn">เข้าสู่ระบบ</button>
              </form>
            </div>

            <div id="signinRegisterScreen" class="d-none" role="tabpanel" aria-labelledby="signinSegRegister">
              <form id="signinRegisterForm" onsubmit="event.preventDefault(); samoPasswordRegister();">
                <div class="signin-field">
                  <label class="signin-label" for="signinRegisterUsername">ชื่อผู้ใช้</label>
                  <input type="text" class="form-control signin-input" id="signinRegisterUsername"
                    autocomplete="username" required minlength="3" aria-describedby="signinRegisterUsernameHelp">
                  <!-- The rules live in TEXT THAT STAYS, not in a placeholder: a
                       placeholder disappears at the first keystroke, which is
                       exactly when the rule starts to matter. -->
                  <p class="signin-help" id="signinRegisterUsernameHelp">อย่างน้อย 3 ตัวอักษร</p>
                </div>
                <div class="signin-field">
                  <label class="signin-label" for="signinRegisterPassword">รหัสผ่าน</label>
                  <div class="signin-input-wrap">
                    <input type="password" class="form-control signin-input" id="signinRegisterPassword"
                      autocomplete="new-password" required minlength="6"
                      aria-describedby="signinRegisterPasswordHelp">
                    <button type="button" class="signin-reveal" data-signin-reveal="signinRegisterPassword"
                      aria-label="แสดงรหัสผ่าน" aria-pressed="false">
                      <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                  </div>
                  <!-- 6, because auth.js registerWithPassword() rejects 5. This
                       said 4 for months, so the form invited a password the code
                       then refused with a red alert — pinned by
                       signin-screen.test.js, which reads the number out of
                       auth.js and compares. -->
                  <p class="signin-help" id="signinRegisterPasswordHelp">อย่างน้อย 6 ตัวอักษร</p>
                </div>
                <div class="signin-field">
                  <label class="signin-label" for="signinRegisterConfirm">ยืนยันรหัสผ่าน</label>
                  <input type="password" class="form-control signin-input" id="signinRegisterConfirm"
                    autocomplete="new-password" required>
                </div>
                <div id="signinRegisterAlert" class="alert alert-danger signin-alert d-none" role="alert"></div>
                <button type="submit" class="btn signin-submit" id="signinRegisterBtn">สมัครสมาชิก</button>
                <!-- The tradeoff, stated once, where the choice is actually made.
                     Not on the login panel: somebody who already has one of these
                     accounts has made the choice and does not need reminding. -->
                <p class="signin-note">บัญชีแบบนี้ไม่ผูกกับอีเมล จึงไม่แสดงข้อมูลสายรหัสและบ้าน</p>
              </form>
            </div>
          </section>

        </div>
      </div>
    </div>
  </div>
