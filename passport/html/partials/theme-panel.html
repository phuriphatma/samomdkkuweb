<!-- Theme panel -->
<div class="theme-panel" id="themePanel">
  <div class="tp-label">Choose your theme</div>
  <div class="tp-swatches">
    <div class="tp-swatch active" data-t="teal"     onclick="setAppTheme('teal',this)"><div class="tp-swatch-dot"></div><div class="tp-swatch-name">Teal</div></div>
    <div class="tp-swatch"        data-t="skycandy" onclick="setAppTheme('skycandy',this)"><div class="tp-swatch-dot"></div><div class="tp-swatch-name">Candy</div></div>
    <div class="tp-swatch"        data-t="navy"     onclick="setAppTheme('navy',this)"><div class="tp-swatch-dot"></div><div class="tp-swatch-name">Navy</div></div>
    <div class="tp-swatch"        data-t="lilac"    onclick="setAppTheme('lilac',this)"><div class="tp-swatch-dot"></div><div class="tp-swatch-name">Lilac</div></div>
    <div class="tp-swatch"        data-t="blush"    onclick="setAppTheme('blush',this)"><div class="tp-swatch-dot"></div><div class="tp-swatch-name">Blush</div></div>
  </div>
</div>
