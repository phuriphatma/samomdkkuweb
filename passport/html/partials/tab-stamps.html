<!-- ── STAMPS TAB ── -->
<div id="tab-stamps" class="tab-pane">
  <div class="page-head">
    <h1 class="page-title">Stamp Collection <span class="page-emoji">🗺️</span></h1>
    <p class="page-sub">Earn stamps by completing MDKKU activities</p>
  </div>
  <div class="info-strip">
    <div class="is-cell"><div class="is-val" id="stamps-collected">—</div><div class="is-lbl">Collected</div></div>
    <div class="is-cell"><div class="is-val" id="stamps-km">—</div><div class="is-lbl">Total km</div></div>
    <div class="is-cell"><div class="is-val" id="stamps-next">—</div><div class="is-lbl">km to next</div></div>
    <div class="is-cell"><div class="is-val" id="stamps-pct">—</div><div class="is-lbl">Completed</div></div>
  </div>
  <div class="stamp-search-bar">
    <input type="search" id="stamp-search" placeholder="🔍 Search stamps…" autocomplete="off" enterkeyhint="search" />
    <div class="stamp-search-results" id="stamp-search-results" style="display:none;"></div>
  </div>
  <div class="filter-scroll" id="stamps-period-row" style="display:none;"></div>
  <div class="filter-scroll" id="dept-filter-row"></div>
  <div class="stamps-grid" id="stamps-grid"></div>
</div>
