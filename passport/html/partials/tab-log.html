<!-- ── LOG TAB ── -->
<div id="tab-log" class="tab-pane">
  <div class="page-head">
    <h1 class="page-title">Flight Log <span class="page-emoji">✈️</span></h1>
    <p class="page-sub">Your MDKKU activity history</p>
  </div>
  <div class="log-grid">
    <div class="stat-banner" id="stat-banner">
      <div class="sb-row"><span class="sb-num" id="log-total-km">—</span><span class="sb-unit">km</span></div>
      <div class="sb-desc" id="log-window-label">Distance traveled</div>
      <div class="sb-bar-bg"><div class="sb-bar-fill" id="log-bar-fill" style="width:0%"></div></div>
      <div class="sb-mini">
        <div class="sb-mini-item"><div class="sb-mini-val" id="log-activities">—</div><div class="sb-mini-lbl">Activities</div></div>
        <div class="sb-mini-item"><div class="sb-mini-val" id="log-season-km">—</div><div class="sb-mini-lbl">Total km</div></div>
        <div class="sb-mini-item"><div class="sb-mini-val" id="log-stamps-count">—</div><div class="sb-mini-lbl">km to next</div></div>
      </div>
    </div>
    <aside id="flightlog-side" class="log-side"></aside>
    <div id="flightlog-list" class="fl-list"></div>
  </div>
</div>
