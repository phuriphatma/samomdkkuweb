# Nginx site for the KKU VM behind the university reverse proxy.
# Install:
#   sudo cp server/nginx-samo.conf /etc/nginx/sites-available/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# The KKU reverse proxy terminates the public certificate and forwards to
# https://10.101.111.181, so this server listens on 443 with the local
# self-signed cert. `server_name _` is a catch-all (the proxy sets Host).
#
# What this replicates from the Cloudflare Pages setup (public/_headers +
# public/_redirects, which Nginx does NOT read):
#   * /notify        -> local Node service (the Pages Function is gone)
#   * /assets/*       -> immutable long cache (hashed filenames)
#   * /build.json     -> no-store (drives the stale-bundle self-heal)
#   * HTML + /admin/  -> no-cache (or iPad Safari pins a stale bundle)
#   * /admin/*        -> admin SPA index (NOT the public one)
#   * /*              -> public SPA index (client router handles /pr, /news/123, /projects-view)

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    root /var/www/samo-web;

    # Discord notify — reverse proxy to the local Node service (systemd
    # unit samo-notify). WITHOUT this every notification silently no-ops.
    location = /notify {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    # Immutable hashed assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Self-heal source of truth — must never be cached.
    location = /build.json {
        add_header Cache-Control "no-store";
    }

    # Admin SPA — separate build entry, its OWN fallback.
    location /admin/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /admin/index.html;
    }

    # Bare /passport (no trailing slash) doesn't match `location /passport/`,
    # so it would fall through to the catch-all and serve samoweb's index.
    # Redirect it to the canonical trailing-slash path (nginx can't auto-redirect
    # here: there's no `passport` dir under /var/www/samo-web to trigger it).
    location = /passport { return 301 /passport/; }

    # Passport app (separate repo + separate Supabase project), built with
    # base '/passport/'. root /var/www so /passport/... maps to /var/www/passport/...
    location /passport/ {
        root /var/www;
        add_header Cache-Control "no-cache, must-revalidate";
        # $uri.html gives Cloudflare-Pages-style clean URLs: OLD printed QR codes
        # encode the extensionless path (/passport/html/scan?aid=..&tk=..); without
        # this fallback nginx skips scan.html and serves index.html → the scan never
        # runs → no point/activity. New QRs use .../html/scan.html so they resolved
        # already. Keep $uri.html BEFORE the index.html fallback.
        try_files $uri $uri.html $uri/ /passport/index.html;
    }

    # Docs site — REDIRECT, not proxied and not served from here.
    #
    # The docs are built by GitHub Actions on every push to main and published
    # to GitHub Pages in ~40 s, with no VPN and nobody in the loop. Serving them
    # from this VM instead would trade that for a manual deploy, because CI
    # cannot reach this machine — which is the whole reason the docs site was
    # put on Pages. So this is the memorable ADDRESS only; the pages still come
    # from Pages.
    #
    # WHY A REDIRECT AND NOT proxy_pass. A proxy would keep the pretty URL in
    # the address bar, but it forces VitePress's `base` to /docs/, which breaks
    # the Pages URL as a standalone fallback — and then the documentation is
    # unreachable exactly when this VM is down, which is when you need it. (The
    # VM *can* reach github.io outbound: measured 2026-08-31, HTTP 200. The
    # objection is not capability, it is coupling.)
    #
    # 302, NOT 301: a permanent redirect is cached by browsers effectively
    # forever, and this target is expected to change once a CNAME exists
    # (docs.samo.md.kku.ac.th — STATE.md, owner question 7). Reversible until
    # that is decided.
    #
    # /docs/CONTRIBUTE and /docs/STEP-BY-STEP carry through to the same page on
    # the site. `/docs` is not a route in PATH_ROUTES (src/js/main.js), so this
    # takes nothing away from the SPA.
    #
    # ⚠️ The hostname below names the GitHub OWNER, which has one home in
    # `package.json`'s repository.url (tools/repo-identity.mjs). Nginx cannot
    # import that, so this is a genuine second copy — `npm test` lists this file
    # when the owner changes, and the VM then needs this config reinstalled, not
    # just a redeploy.
    location ~ ^/docs(?:/(.*))?$ {
        return 302 https://phuriphatma.github.io/samomdkkuweb/$1;
    }

    # Public SPA — catch-all, must be last.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Don't serve the inert Cloudflare control files if they linger.
    location ~ /_(headers|redirects)$ { return 404; }
}
