# Nginx site for the KKU VM behind the university reverse proxy.
# Install:
#   sudo cp server/nginx-samo.conf /etc/nginx/sites-available/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# The KKU reverse proxy terminates the public certificate and forwards to
# https://10.101.111.181, so this server listens on 443 with the local
# self-signed cert. `server_name _` is a catch-all (the proxy sets Host).
#
# What this replicates from the Cloudflare Pages setup (public/_headers +
# public/_redirects, which Nginx does NOT read):
#   * /notify        -> local Node service (the Pages Function is gone)
#   * /assets/*       -> immutable long cache (hashed filenames)
#   * /build.json     -> no-store (drives the stale-bundle self-heal)
#   * HTML + /admin/  -> no-cache (or iPad Safari pins a stale bundle)
#   * /admin/*        -> admin SPA index (NOT the public one)
#   * /*              -> public SPA index (client router handles /pr, /news/123, /projects-view)

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    root /var/www/samo-web;

    # Discord notify — reverse proxy to the local Node service (systemd
    # unit samo-notify). WITHOUT this every notification silently no-ops.
    location = /notify {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    # Immutable hashed assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Self-heal source of truth — must never be cached.
    location = /build.json {
        add_header Cache-Control "no-store";
    }

    # Admin SPA — separate build entry, its OWN fallback.
    location /admin/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /admin/index.html;
    }

    # Bare /passport (no trailing slash) doesn't match `location /passport/`,
    # so it would fall through to the catch-all and serve samoweb's index.
    # Redirect it to the canonical trailing-slash path (nginx can't auto-redirect
    # here: there's no `passport` dir under /var/www/samo-web to trigger it).
    location = /passport { return 301 /passport/; }

    # Passport app (separate repo + separate Supabase project), built with
    # base '/passport/'. root /var/www so /passport/... maps to /var/www/passport/...
    location /passport/ {
        root /var/www;
        add_header Cache-Control "no-cache, must-revalidate";
        # $uri.html gives Cloudflare-Pages-style clean URLs: OLD printed QR codes
        # encode the extensionless path (/passport/html/scan?aid=..&tk=..); without
        # this fallback nginx skips scan.html and serves index.html → the scan never
        # runs → no point/activity. New QRs use .../html/scan.html so they resolved
        # already. Keep $uri.html BEFORE the index.html fallback.
        try_files $uri $uri.html $uri/ /passport/index.html;
    }

    # Docs site — SERVED FROM THIS BOX at /docs, not redirected.
    #
    # KKU issues no subdomain (no docs.samo.md.kku.ac.th), so the path on the
    # main host is the only address that reads as official. Serving the real
    # pages here — rather than bouncing to a personal github.io URL — is also
    # the mainstream shape: nextjs.org/docs, tailwindcss.com/docs,
    # supabase.com/docs and kubernetes.io/docs all answer 200 at the path
    # (measured 2026-08-31). stripe.com/docs is the other standard and it
    # redirects to a SUBDOMAIN, which is the option we do not have.
    #
    # Built by server/deploy.sh with DOCS_BASE=/docs/, and kept fresh between
    # deploys by samo-docs.timer. GitHub Pages still publishes the same docs at
    # the default base, so the documentation survives this VM being down —
    # which matters, because documentation is what you read when the thing it
    # documents is broken.
    #
    # `root /var/www` + `location /docs/` maps /docs/x to /var/www/docs/x —
    # identical to the passport block above.
    location = /docs { return 301 /docs/; }

    location /docs/ {
        root /var/www;
        # VitePress cleanUrls: true — links are extensionless (/docs/CONTRIBUTE)
        # while the file on disk is CONTRIBUTE.html. $uri.html is what bridges
        # them, and it must come BEFORE the directory try, exactly as the
        # passport block needs it for old QR-code paths.
        # `try_files ... /docs/404.html` would serve the 404 PAGE with a 200
        # STATUS — a dead link then looks healthy to every link checker, uptime
        # monitor and crawler, which is the failure mode where you find out from
        # a human months later. `=404` plus `error_page` gives the reader the
        # nice page AND the honest status. Measured: /docs/NOPE answered 200
        # before this line existed.
        error_page 404 /docs/404.html;
        try_files $uri $uri.html $uri/ =404;
        # Hashed assets under /docs/assets/ are immutable; the HTML is not.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /docs/assets/ {
        root /var/www;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public SPA — catch-all, must be last.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Don't serve the inert Cloudflare control files if they linger.
    location ~ /_(headers|redirects)$ { return 404; }
}
