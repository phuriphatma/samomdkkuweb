<head>
  <meta charset="UTF-8" />

  <!-- Deprecated-host guard: the *.pages.dev deployments are retired now that
       the app is self-hosted at samo.md.kku.ac.th. On any pages.dev host,
       forward to the "we've moved" splash (preserving the deep link). Fires
       only on *.pages.dev — never on the VM domain or localhost dev. -->
  <script>
    (function () {
      try {
        if (/\.pages\.dev$/i.test(location.hostname) && location.pathname !== '/moved.html') {
          location.replace('/moved.html?next=' + encodeURIComponent(location.pathname + location.search + location.hash));
        }
      } catch (e) {}
    })();
  </script>

  <!-- ── BOOT WATCHDOG ──────────────────────────────────────────────────────
       Reported from an iPad: *"i press สร้างบัญชีและเข้าสู่ระบบด้วย google and
       button do nothing, like when i click on อุปบริหาร on ฝ่าย it also do
       nothing on safari, but on google app it works"*.

       Reproduced on WebKit at iPad size by 404ing the module below. Every
       symptom matched exactly: the drawer OPENS, the sign-in modal OPENS, and
       everything inside them does NOTHING — silently.

       WHY IT LOOKS ALIVE WHILE BEING DEAD. Bootstrap is a classic <script> from
       a CDN and keeps working, so every `data-bs-toggle` still opens its menu.
       Our own code is an ES module, and 90 controls in these partials are inline
       `onclick="activateTab(...)"` calling globals that module defines. Lose the
       module and you lose all ninety, while the page still animates — the worst
       possible failure shape, because nothing tells the person anything.

       WHY THE MODULE GOES MISSING. `server/deploy.sh` keeps old hashed chunks on
       purpose (c5edc16), but only back to the oldest deploy on disk — 2026-08-18
       at the time of writing. A Safari tab left open for longer, restored from a
       suspended tab or the back/forward cache, re-runs an index.html that names
       a bundle the server no longer has. A flaky connection at load time
       produces the identical result, which is why this is not really a cache
       bug: ANY failure to fetch the entry module lands here.

       THE FIX IS DETECTION, NOT PREVENTION. This is a classic script, so it runs
       even when the module does not, and the module clears the flag as its first
       act. If it never does, the reader gets told and gets one tap that fixes it
       — a reload with a cache-busting query, because a plain location.reload()
       on iOS may re-serve the same stale HTML that caused this.
       ──────────────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      window.__samoBooted = false;
      var notes = [];
      var RETRIED = /[?&]_r=/.test(location.search);
      var started = Date.now();
      var HARD = 25000;              // stop waiting and speak up
      var GIVE_UP = 90000;           // stop watching entirely

      function booted() { return window.__samoBooted === true; }
      function note(s) { if (s && notes.indexOf(s) === -1 && notes.length < 6) notes.push(s); }
      function dismiss() {
        var b = document.getElementById('samoBootFail'); if (b) b.parentNode.removeChild(b);
        var d = document.getElementById('samoBootDiag'); if (d) d.parentNode.removeChild(d);
      }

      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t.tagName === 'SCRIPT' && String(t.src || '').indexOf('/assets/') !== -1) {
          note('script failed: ' + String(t.src).split('/').pop());
          tell();                      // a DEFINITE failure — no need to wait
        } else if (e && e.message) {
          note(e.message + (e.filename ? ' @' + String(e.filename).split('/').pop() : '')
               + (e.lineno ? ':' + e.lineno : ''));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        note('promise: ' + String((e && e.reason && e.reason.message) || e.reason || '').slice(0, 120));
      });

      // ── WHEN TO SPEAK, and this is where the first version was wrong ───────
      // v1 fired on a bare 8-second timer. Reproduced on WebKit by delaying the
      // bundle 11s and letting it ARRIVE: the app booted fine and the bar
      // appeared anyway — then never left, because nothing removed it. On a slow
      // connection that repeats on every load, which is exactly what the owner
      // hit ("even i press the โหลดใหม่ … it still show it"). A warning that
      // cannot be wrong is a warning nobody can act on, and this one was wrong
      // in the most common case: a phone on bad wifi.
      //
      // So: two DEFINITE signals, and no bare timer.
      //   • the module element's error event — it will never arrive;
      //   • the window `load` event — every resource has settled, so a module
      //     that has still not reported has errored or thrown.
      // The 25 s deadline is only a backstop for a load event that never comes,
      // and even then it defers while the document is still loading.
      //
      // AND IT IS REVERSIBLE. The poll keeps running after the bar is shown, so
      // a module that arrives late takes the bar away with it. Nothing here is
      // allowed to be a one-way door.
      function check() {
        if (booted()) { dismiss(); return; }
        var waited = Date.now() - started;
        if (document.readyState === 'complete' || waited > HARD) tell();
        if (waited < GIVE_UP) setTimeout(check, 1000);
      }
      window.addEventListener('load', function () { setTimeout(check, 400); });
      setTimeout(check, HARD);

      function diagnostics() {
        var el = document.querySelector('script[type="module"][src]');
        return [
          'SAMO boot failure',
          'url: ' + location.href,
          'bundle: ' + (el ? el.getAttribute('src') : '(no module tag)'),
          'retried: ' + RETRIED + '  waited: ' + Math.round((Date.now() - started) / 1000) + 's',
          'readyState: ' + document.readyState,
          'ua: ' + navigator.userAgent,
          'errors: ' + (notes.length ? notes.join(' | ') : '(none captured)'),
        ].join('\n');
      }

      function tell() {
        if (booted() || document.getElementById('samoBootFail')) return;
        var bar = document.createElement('div');
        bar.id = 'samoBootFail';
        bar.setAttribute('role', 'alert');
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;'
          + 'background:#7d4f16;color:#fff;padding:12px 14px;font:600 13px/1.5 system-ui,sans-serif;'
          + 'display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center';
        var btn = 'font:inherit;border:0;border-radius:999px;padding:7px 14px;cursor:pointer';

        // FIRST failure vs REPEAT. A reload only helps when the HTML named a
        // bundle that is gone; if `_r=` is already in the URL it did not, and
        // re-offering the same button reads as the fix being broken too.
        if (!RETRIED) {
          bar.innerHTML = '<span>โหลดหน้าเว็บได้ไม่ครบ ปุ่มต่าง ๆ อาจยังกดไม่ได้</span>'
            + '<button type="button" id="samoBootRetry" style="' + btn
            + ';background:#fff;color:#7d4f16">โหลดใหม่</button>';
        } else {
          bar.innerHTML = '<span>ยังโหลดไม่สำเร็จหลังลองใหม่แล้ว — ส่งรายละเอียดให้ผู้ดูแลได้เลย</span>'
            + '<button type="button" id="samoBootCopy" style="' + btn
            + ';background:#fff;color:#7d4f16">คัดลอกรายละเอียด</button>'
            + '<button type="button" id="samoBootShow" style="' + btn
            + ';background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55)">ดูรายละเอียด</button>';
        }
        document.body.appendChild(bar);

        var r = document.getElementById('samoBootRetry');
        if (r) r.onclick = function () {
          // A cache-busting NAVIGATION, not reload(): on iOS a plain reload can
          // re-serve the very HTML that named the missing bundle.
          location.replace(location.pathname
            + (location.search ? location.search + '&' : '?') + '_r=' + Date.now() + location.hash);
        };
        var c = document.getElementById('samoBootCopy');
        if (c) c.onclick = function () {
          var text = diagnostics();
          function fallback() { show(text, true); }
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(function () { c.textContent = 'คัดลอกแล้ว'; }, fallback);
            } else { fallback(); }
          } catch (err) { fallback(); }
        };
        var s = document.getElementById('samoBootShow');
        if (s) s.onclick = function () { show(diagnostics(), false); };

        function show(text, selectable) {
          if (document.getElementById('samoBootDiag')) return;
          var pre = document.createElement('textarea');
          pre.id = 'samoBootDiag';
          pre.readOnly = true;
          pre.value = text;
          pre.style.cssText = 'position:fixed;left:8px;right:8px;bottom:56px;height:34vh;'
            + 'z-index:2147483647;background:#fff;color:#222;border-radius:8px;padding:10px;'
            + 'font:400 12px/1.45 ui-monospace,Menlo,monospace;border:0';
          document.body.appendChild(pre);
          if (selectable) { pre.focus(); pre.select(); }
        }
      }
    })();
  </script>
