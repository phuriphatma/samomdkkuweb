<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>ย้ายไปโดเมนใหม่ · MDKKU SAMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:       #05130a;
      --ink-panel: rgba(11, 40, 22, 0.46);
      --pine:      #105922;
      --pine-lite: #1f9142;
      --mist:      #eaf4ec;
      --mist-dim:  rgba(234, 244, 236, 0.60);
      --mist-fade: rgba(234, 244, 236, 0.30);
      --orange:    #ff6f30;
      --orange-lite:#ffb184;
      --line:      rgba(234, 244, 236, 0.12);
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
      --sans: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
      --display: "Prompt", var(--sans);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      font-family: var(--sans);
      color: var(--mist);
      background: var(--ink);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(1.25rem, 4vw, 3rem);
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Ambient aurora: pine light rising from below-left, an orange beacon
       low-right — the two brand colors, positioned like a horizon at dusk. */
    .aurora {
      position: fixed;
      inset: -20% -20% -20% -20%;
      z-index: 0;
      background:
        radial-gradient(46% 52% at 18% 88%, rgba(31, 145, 66, 0.34), transparent 70%),
        radial-gradient(38% 44% at 88% 82%, rgba(255, 111, 48, 0.20), transparent 68%),
        radial-gradient(60% 60% at 50% -10%, rgba(16, 89, 34, 0.28), transparent 72%);
      filter: saturate(1.05);
      animation: drift 18s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate3d(-1.5%, -1%, 0) scale(1.02); }
      to   { transform: translate3d(2%, 1.5%, 0) scale(1.08); }
    }

    /* Faint starfield so the dark field isn't flat. */
    .stars { position: fixed; inset: 0; z-index: 0; opacity: 0.5; }
    .stars i {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: var(--mist); opacity: 0.35;
      animation: twinkle 4s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.12; }
      50%      { opacity: 0.55; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(640px, 100%);
      text-align: center;
      background: linear-gradient(180deg, rgba(11, 40, 22, 0.55), rgba(5, 19, 10, 0.30));
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: clamp(1.75rem, 5vw, 3rem) clamp(1.5rem, 5vw, 3.25rem) clamp(1.75rem, 4vw, 2.5rem);
      backdrop-filter: blur(14px) saturate(1.1);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
      box-shadow: 0 40px 120px -50px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(234, 244, 236, 0.06);
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--orange-lite);
      margin: 0 0 clamp(1.25rem, 4vw, 1.75rem);
      opacity: 0;
      animation: rise 0.7s 0.05s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .eyebrow b { color: var(--mist); font-weight: 600; }

    /* Signature: the relocation arc */
    .scene { width: 100%; max-width: 440px; margin: 0 auto clamp(1.25rem, 4vw, 1.75rem); display: block;
      opacity: 0; animation: rise 0.8s 0.15s cubic-bezier(.2,.7,.2,1) forwards; }
    .route-track { stroke: var(--line); stroke-width: 1.5; fill: none; stroke-dasharray: 3 7; }
    .route-flow {
      stroke: var(--pine-lite); stroke-width: 2; fill: none;
      stroke-dasharray: 5 11; stroke-linecap: round;
      animation: flow 1.4s linear infinite;
    }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .cloud { fill: var(--mist); opacity: 0.16; }
    .cloud-label { fill: var(--mist-fade); font-family: var(--mono); font-size: 9px; letter-spacing: 0.05em; }
    .home-body { fill: var(--pine); stroke: var(--pine-lite); stroke-width: 1.5; }
    .home-roof { fill: none; stroke: var(--orange); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .home-win  { fill: var(--orange-lite); }
    .home-halo { fill: var(--orange); opacity: 0.22; animation: beacon 2.6s ease-in-out infinite; transform-origin: center; }
    @keyframes beacon {
      0%, 100% { opacity: 0.10; transform: scale(0.85); }
      50%      { opacity: 0.30; transform: scale(1.25); }
    }

    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(1.6rem, 5.4vw, 2.5rem);
      line-height: 1.18;
      margin: 0 0 0.7rem;
      letter-spacing: -0.01em;
      opacity: 0;
      animation: rise 0.8s 0.28s cubic-bezier(.2,.7,.2,1) forwards;
    }
    h1 .accent { color: var(--orange); }

    .lede {
      font-size: clamp(0.95rem, 2.6vw, 1.05rem);
      font-weight: 300;
      line-height: 1.65;
      color: var(--mist-dim);
      margin: 0 auto clamp(1.5rem, 4vw, 2rem);
      max-width: 42ch;
      opacity: 0;
      animation: rise 0.8s 0.4s cubic-bezier(.2,.7,.2,1) forwards;
    }

    /* Address swap plaques */
    .swap {
      display: flex; align-items: stretch; justify-content: center; gap: 0.65rem;
      flex-wrap: wrap;
      margin: 0 0 clamp(1.6rem, 4vw, 2.1rem);
      opacity: 0;
      animation: rise 0.8s 0.52s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .plaque {
      font-family: var(--mono);
      font-size: clamp(0.72rem, 2.3vw, 0.86rem);
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 0.15rem;
      min-width: 0;
    }
    .plaque .tag { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mist-fade); }
    .plaque.old { background: rgba(234,244,236,0.03); }
    .plaque.old .addr { color: var(--mist-fade); text-decoration: line-through; text-decoration-color: rgba(255,111,48,0.5); word-break: break-all; }
    .plaque.new { background: linear-gradient(180deg, rgba(31,145,66,0.20), rgba(16,89,34,0.10)); border-color: rgba(31,145,66,0.45); box-shadow: 0 0 0 1px rgba(31,145,66,0.15), 0 12px 40px -20px rgba(31,145,66,0.8); }
    .plaque.new .tag { color: var(--pine-lite); }
    .plaque.new .addr { color: var(--mist); font-weight: 600; word-break: break-all; }
    .swap .arrow { align-self: center; color: var(--orange); font-size: 1.1rem; line-height: 1; }

    .cta {
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(1rem, 2.8vw, 1.1rem);
      color: #05130a;
      background: linear-gradient(180deg, #ffb184, var(--orange));
      border: none;
      padding: 0.85rem 1.7rem;
      border-radius: 999px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 18px 46px -18px rgba(255, 111, 48, 0.85), inset 0 1px 0 rgba(255,255,255,0.4);
      transition: transform 0.18s cubic-bezier(.2,.7,.2,1), box-shadow 0.18s ease;
      opacity: 0;
      animation: rise 0.8s 0.62s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .cta:hover { transform: translateY(-2px); box-shadow: 0 24px 56px -18px rgba(255, 111, 48, 0.95), inset 0 1px 0 rgba(255,255,255,0.5); }
    .cta:active { transform: translateY(0); }
    .cta:focus-visible { outline: 2px solid var(--orange-lite); outline-offset: 3px; }
    .cta svg { width: 1.05em; height: 1.05em; }

    .meta {
      margin: clamp(1.25rem, 3vw, 1.6rem) 0 0;
      font-size: 0.82rem;
      color: var(--mist-fade);
      min-height: 1.2em;
      opacity: 0;
      animation: rise 0.8s 0.72s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .meta #count { color: var(--orange-lite); font-family: var(--mono); font-weight: 600; }
    .meta button {
      background: none; border: none; color: var(--mist-dim); cursor: pointer;
      font: inherit; text-decoration: underline; text-underline-offset: 3px; padding: 0;
    }
    .meta button:hover { color: var(--mist); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora, .stars i, .route-flow, .home-halo { animation: none; }
      .eyebrow, .scene, h1, .lede, .swap, .cta, .meta { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="aurora"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <main class="card" role="main">
    <p class="eyebrow">MDKKU&nbsp;SAMO&nbsp;·&nbsp;<b>ย้ายโดเมนถาวร</b></p>

    <!-- Signature: rented cloud → our own server, a pulse traveling home -->
    <svg class="scene" viewBox="0 0 440 168" fill="none" aria-hidden="true">
      <!-- route -->
      <path id="route" class="route-track" d="M 78 118 Q 230 26 366 84" />
      <path class="route-flow" d="M 78 118 Q 230 26 366 84" />

      <!-- rented cloud (old) -->
      <g transform="translate(38, 96)">
        <path class="cloud" d="M 12 24 a 14 14 0 0 1 4 -27 a 18 18 0 0 1 34 4 a 12 12 0 0 1 -2 23 z" />
        <text class="cloud-label" x="20" y="44" text-anchor="middle">pages.dev</text>
      </g>

      <!-- our server / home (new) -->
      <g transform="translate(366, 84)">
        <circle class="home-halo" r="30" />
        <rect class="home-body" x="-20" y="-6" width="40" height="34" rx="6" />
        <polyline class="home-roof" points="-26,-4 0,-26 26,-4" />
        <rect class="home-win" x="-6" y="6" width="12" height="14" rx="2" />
      </g>

      <!-- traveling pulse -->
      <circle r="4.5" fill="#ff6f30">
        <animateMotion dur="3s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
          <mpath href="#route" />
        </animateMotion>
        <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;1;1;1;0" keyTimes="0;0.08;0.5;0.9;1" />
      </circle>
    </svg>

    <h1>เรามี<span class="accent">เซิร์ฟเวอร์</span>ของเราเองแล้ว</h1>

    <p class="lede">
      ระบบ MDKKU SAMO ย้ายจากโฮสต์ชั่วคราวไปอยู่บนเซิร์ฟเวอร์ของเราเองอย่างถาวร
      กรุณาเปลี่ยนไปใช้โดเมนใหม่ และบันทึกลิงก์ไว้แทนของเดิม
    </p>

    <div class="swap">
      <div class="plaque old">
        <span class="tag">ที่อยู่เดิม</span>
        <span class="addr" id="oldAddr">…</span>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
      <div class="plaque new">
        <span class="tag">ที่อยู่ใหม่</span>
        <span class="addr" id="newAddr">samo.md.kku.ac.th</span>
      </div>
    </div>

    <a class="cta" id="go" href="https://samo.md.kku.ac.th">
      ไปที่เว็บไซต์ใหม่
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <p class="meta" id="meta">
      กำลังพาไปยังเว็บไซต์ใหม่ใน <span id="count">30</span> วินาที ·
      <button type="button" id="stay">อยู่หน้านี้ก่อน</button>
    </p>
  </main>

  <script>
    (function () {
      // ---- destination: preserve the deep link the user arrived with ----
      var NEW_ORIGIN = 'https://samo.md.kku.ac.th';
      var params = new URLSearchParams(location.search);
      var next = params.get('next') || '/';
      if (next.charAt(0) !== '/') next = '/' + next;           // guard against odd input
      var target = NEW_ORIGIN + next;

      var go = document.getElementById('go');
      go.href = target;

      // Old address = the pages.dev host they're actually on, + the path.
      var oldPath = (next === '/' ? '' : next);
      document.getElementById('oldAddr').textContent = location.hostname + oldPath;
      document.getElementById('newAddr').textContent = 'samo.md.kku.ac.th' + oldPath;

      // ---- starfield ----
      var stars = document.getElementById('stars');
      var frag = document.createDocumentFragment();
      for (var i = 0; i < 40; i++) {
        var s = document.createElement('i');
        s.style.left = (Math.random() * 100) + '%';
        s.style.top = (Math.random() * 100) + '%';
        s.style.animationDelay = (Math.random() * 4) + 's';
        frag.appendChild(s);
      }
      stars.appendChild(frag);

      // ---- countdown auto-redirect (cancelable) ----
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var left = 30;
      var countEl = document.getElementById('count');
      var meta = document.getElementById('meta');
      var timer = setInterval(function () {
        left -= 1;
        if (left <= 0) {
          clearInterval(timer);
          location.replace(target);
          return;
        }
        countEl.textContent = left;
      }, 1000);

      document.getElementById('stay').addEventListener('click', function () {
        clearInterval(timer);
        meta.innerHTML = 'ยกเลิกการพาไปอัตโนมัติแล้ว — กดปุ่มด้านบนเพื่อไปยังเว็บไซต์ใหม่';
      });

      // Respect reduced-motion for the SVG SMIL pulse too.
      if (reduce) {
        var svg = document.querySelector('svg.scene');
        if (svg && svg.pauseAnimations) { try { svg.pauseAnimations(); } catch (e) {} }
      }
    })();
  </script>
</body>
</html>
